[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-portfolio-lab"
version = "0.2.0"
description = "Walk-forward covariance estimation study for cross-asset ETF portfolios"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "yfinance==1.5.2",
]

[project.optional-dependencies]
dev = [
    "setuptools==83.0.0",
    "pytest==9.1.1",
    "ipykernel==7.3.0",
    "nbformat==5.10.4",
    "nbclient==0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
cache_dir = ".cache/pytest"
